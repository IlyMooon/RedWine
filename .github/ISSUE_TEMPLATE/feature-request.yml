name: Demande de fonctionnalité
description: Proposer une idée, une amélioration ou une nouvelle fonctionnalité pour RedWine.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de contribuer à l'évolution de **RedWine** ! Exprimez votre besoin ou votre idée de manière structurée ci-dessous.

  - type: textarea
    id: problem-description
    attributes:
      label: Votre suggestion répond-elle à un problème ou une limitation existante ?
      description: Expliquez pourquoi cette fonctionnalité est utile ou quel manque elle comble dans RedWine.
      placeholder: Je rencontre souvent la situation suivante...
    validations:
      required: false

  - type: textarea
    id: proposed-solution
    attributes:
      label: Solution ou fonctionnalité proposée
      description: Décrivez précisément le comportement ou l'interface que vous aimeriez voir implémenté.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
      description: Avez-vous envisagé d'autres approches ou solutions de contournement ?
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Contexte additionnel / Captures d'écran
      description: Ajoutez toute information, maquette, lien de référence ou capture d'écran pouvant clarifier votre demande.
    validations:
      required: false
